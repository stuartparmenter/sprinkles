[workspace]
members = ["crates/bevy_sprinkles", "crates/bevy_sprinkles_editor", "benches"]
resolver = "3"

[workspace.lints.clippy]
type_complexity = "allow"
too_many_arguments = "allow"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[workspace.dependencies]
bevy = { version = "0.20.0-dev", default-features = false, features = [
    "default_app",
    "default_platform",
    "3d_api",
    "3d_bevy_render",
    "ui_api",
    "ui_bevy_render",
    "picking",
    "bevy_ui_widgets",
    "system_clipboard",
    "bevy_scene",
    # "reflect_auto_register",
] }
serde = { version = "1", features = ["derive"] }
ron = "0.10"
thiserror = "2"
bytemuck = { version = "1.14", features = ["derive"] }
bitflags = { version = "2", features = ["serde"] }
paste = "1"

# Resolve the bevy 0.20.0-dev requirement from the rtg-dev fork of bevy main
# (crates.io has no 0.20 release). Mirrors the patch set enid's workspace uses
# when it consumes bevy_sprinkles as a git dependency.
[patch.crates-io]
bevy = { git = "https://github.com/stuartparmenter/bevy", branch = "rtg-dev" }
